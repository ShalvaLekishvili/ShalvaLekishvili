<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="285" viewBox="0 0 1200 285" role="img" aria-label="Reviewer routes"><rect width="1200" height="285" rx="26" fill="#050b14"/><text x="42" y="43" fill="#94a3b8" font-family="Arial" font-size="13" font-weight="700" letter-spacing="2">REVIEWER ROUTES</text><rect x="42" y="82" width="350" height="157" rx="20" fill="#0b1220" stroke="#26364e"/><rect x="42" y="82" width="6" height="157" rx="3" fill="#60a5fa"/><text x="70" y="117" fill="#60a5fa" font-family="Arial" font-size="11" font-weight="700">HIRING MANAGER</text><text x="70" y="153" fill="#f8fafc" font-family="Arial" font-size="20" font-weight="800">60-second route</text><text x="70" y="190" fill="#cbd5e1" font-family="Arial" font-size="11">Role → proof stack → credentials</text><text x="70" y="211" fill="#cbd5e1" font-family="Arial" font-size="11">→ business impact</text><rect x="428" y="82" width="350" height="157" rx="20" fill="#0b1220" stroke="#26364e"/><rect x="428" y="82" width="6" height="157" rx="3" fill="#38bdf8"/><text x="456" y="117" fill="#38bdf8" font-family="Arial" font-size="11" font-weight="700">SOC / BLUE TEAM LEAD</text><text x="456" y="153" fill="#f8fafc" font-family="Arial" font-size="20" font-weight="800">3-minute route</text><text x="456" y="190" fill="#cbd5e1" font-family="Arial" font-size="11">Detections → investigations</text><text x="456" y="211" fill="#cbd5e1" font-family="Arial" font-size="11">→ operating model → deliverables</text><rect x="814" y="82" width="350" height="157" rx="20" fill="#0b1220" stroke="#26364e"/><rect x="814" y="82" width="6" height="157" rx="3" fill="#2dd4bf"/><text x="842" y="117" fill="#2dd4bf" font-family="Arial" font-size="11" font-weight="700">TECHNICAL REVIEWER</text><text x="842" y="153" fill="#f8fafc" font-family="Arial" font-size="20" font-weight="800">5-minute route</text><text x="842" y="190" fill="#cbd5e1" font-family="Arial" font-size="11">Repositories → architecture → tests</text><text x="842" y="211" fill="#cbd5e1" font-family="Arial" font-size="11">→ security model → manifest</text></svg>